# edit-prd/complete.yaml
#
# Purpose: Updates the PRD issue description when the PRD is edited.
# Input variables: (none)
# Output variables: (none)
# Side effects: updates the PRD issue description on the issue tracker; commits and
#               pushes {planning_artifacts}; creates and removes
#               /tmp/prd-desc-{prd_key}.md

- INCLUDE: common/check-config
# Find the PRD issue
- SET: { variable: search_text, value: "PRD: {prd_key}" }
- INCLUDE: common/find-issue
- CHECK: empty issue_id
  TRUE:
    - OUTPUT:
        message: "PRD issue not found. Skipping."
        stop: true
# Strip frontmatter and write description file
- RUN: uv run --no-project python -c "
import sys
with open(sys.argv[1], 'r', encoding='utf-8') as f:
    lines = f.readlines()
count = 0
start = 0
for i, line in enumerate(lines):
    if line.strip() == '---':
        count += 1
        if count == 2:
            start = i + 1
            break
print(''.join(lines[start:]).strip())
" {planning_artifacts}/prd.md
  STORE: prd_body
- WRITE:
    file: /tmp/prd-desc-{prd_key}.md
    content: "**PRD:** {prd_key}\n\n---\n\n{prd_body}"
    mode: overwrite
# Update issue description via common sub-workflow
- SET: { variable: description_file, value: "/tmp/prd-desc-{prd_key}.md" }
- INCLUDE: common/update-issue-description
- RUN: rm -f /tmp/prd-desc-{prd_key}.md
# Same as bmad-prd's update branch (#87): the hook mirrored the edit to the tracker and
# returned, leaving the edit itself uncommitted in the PRD worktree. The header always
# promised the /tmp body was removed too; nothing removed it.
- RUN: git add {planning_artifacts}
- RUN: git commit --allow-empty -m "update PRD {prd_key}"
- RUN: git push -u origin HEAD
- OUTPUT:
    message: "PRD {prd_key} edit committed and pushed."
