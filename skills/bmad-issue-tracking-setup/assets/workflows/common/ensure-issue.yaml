# common/ensure-issue.yaml
#
# Purpose: Ensures the story's issue exists on the tracker — finds it by title
#          (scoped by prd label), creates it if missing with the story spec body,
#          sprint key, epic and prd context. Reused by post-dev-complete phases.
# Input variables:
#   - story_key: the story key (e.g. 1-3-login-form) — must be set
#   - epic_num: the epic number (first dash segment of story_key)
#   - story_num: the story number (second dash segment)
#   - prd_key: the PRD key (from scope)
#   - story_branch: the story branch name (for reference)
#   - spec_file: the spec path the runtime resolved (optional; the legacy
#     {implementation_artifacts}/{story_key}.md is the fallback)
# Output variables:
#   - issue_id: the issue IID (GitLab) or number (GitHub); empty if story file missing
#   - spec_path: the resolved spec file (see the resolution step below); empty if none
# Side effects: creates the issue on the tracker if not found; writes /tmp/issue-desc.md

# Resolve the spec file. {spec_file} is the path the runtime already resolved, in
# whichever mode applies (sprint: spec-<storyId>-<slug>.md; stories:
# stories/<id>-<slug>.md). The legacy {implementation_artifacts}/{story_key}.md is
# still tried second so existing consumers do not regress — but it never matches in
# sprint mode, because the slug comes from the story TITLE, not the story key.
- RUN: if [ -n "{spec_file}" ] && [ -f "{spec_file}" ]; then echo "{spec_file}"; elif [ -f "{implementation_artifacts}/{story_key}.md" ]; then echo "{implementation_artifacts}/{story_key}.md"; fi
  STORE: spec_path
# Derive story title and body from the story spec file
- RUN: cat "{spec_path}" 2>/dev/null
  STORE: story_body
- CHECK: empty story_body
  TRUE:
    - SET: { variable: issue_id, value: "" }
    - OUTPUT:
        message: "Story spec not found — tried '{spec_file}' then '{implementation_artifacts}/{story_key}.md' — cannot create issue"
  FALSE:
    # ONE title rule, shared with common/sync-issues.yaml: common/story-title.yaml. Both
    # files used to carry their own copy and the copies had drifted — sync-issues let a
    # title that already began with "Story " through untouched, this one stripped a
    # "Story N.M:" prefix off an H1 but never off the frontmatter, so a spec whose
    # frontmatter reads `title: 'Story 1.1: Login Form'` came out as
    # "Story 1.1: Story 1.1: Login Form" here and "Story 1.1: Login Form" there. That
    # string is the identity create-issue.yaml dedupes by.
    # The atomic returns the BARE title; the prefix is composed below, once. An empty
    # answer (no spec, and a key with no slug segments) keeps the wording this file has
    # always used.
    - INCLUDE: common/story-title
    - CHECK: empty story_title
      TRUE:
        - SET: { variable: story_title, value: "Untitled" }
    - WRITE:
        file: /tmp/issue-desc.md
        content: "**Sprint Key:** `{story_key}`\n**Epic:** {epic_num}\n**PRD:** {prd_key}\n\n---\n\n{story_body}"
        mode: overwrite
    - SET: { variable: title, value: "Story {epic_num}.{story_num}: {story_title}" }
    - SET: { variable: labels, value: "type{sep}story\nstatus{sep}ready-for-dev\nprd{sep}{prd_key}\n{prd_key}{sep}epic-{epic_num}" }
    - SET: { variable: description_file, value: "/tmp/issue-desc.md" }
    - SET: { variable: search_text, value: "{story_key}" }
    - INCLUDE: common/find-issue
    - CHECK: empty issue_id
      TRUE:
        - INCLUDE: common/create-issue
    - RUN: rm -f /tmp/issue-desc.md