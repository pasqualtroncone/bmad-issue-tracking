# common/ensure-issue.yaml
#
# Purpose: Ensures the story's issue exists on the tracker — finds it through
#          common/find-issue by the `**Sprint Key:**` body marker (scoped by the prd
#          label), creates it if missing with the story spec body, sprint key, epic and
#          prd context. Reused by post-dev-complete phases. Title matching belongs to
#          common/create-issue, which uses it to dedupe before creating.
# Input variables:
#   - story_key: the story key (e.g. 1-3-login-form) — must be set
#   - epic_num: the epic number (first dash segment of story_key)
#   - story_num: the story number (second dash segment)
#   - prd_key: the PRD key (from scope)
#   - story_branch: the story branch name (for reference)
#   - spec_file: the spec path the runtime resolved (optional; common/story-title.yaml
#     owns the full candidate list when it is empty)
# Output variables:
#   - issue_id: the issue IID (GitLab) or number (GitHub)
#   - spec_path: the spec file common/story-title.yaml resolved; empty if none
# Side effects: creates the issue on the tracker if not found; writes /tmp/issue-desc-{story_key}.md
#
# ONE rule for BOTH the spec's location and its title, shared with common/sync-issues.yaml:
# common/story-title.yaml. This file used to resolve the spec itself, from {spec_file} and
# the legacy {implementation_artifacts}/{story_key}.md only, while the atomic it then
# INCLUDEd looked at five candidates — so in sprint mode with an empty {spec_file} the body
# came out empty while the spec sat at spec-<storyId>-<slug>.md, which the atomic finds.
# spec_path is seeded empty: this file has no path of its own to offer, and the atomic must
# not adopt one a previous INCLUDE left in scope.
# The atomic returns the BARE title; the prefix is composed below, once. An empty answer
# (no spec, and a key with no slug segments) keeps the wording this file has always used.
- SET: { variable: spec_path, value: "" }
- INCLUDE: common/story-title
# The body comes from the path the atomic resolved, so body and title read the same file.
# The guard keeps the step at exit 0 when nothing was found (lang §5 stops a workflow on a
# RUN with an unexpected exit code).
- RUN: if [ -n "{spec_path}" ] && [ -f "{spec_path}" ]; then cat "{spec_path}"; fi
  STORE: story_body
- CHECK: empty story_body
  TRUE:
    # HALT, not "return with issue_id unset": every caller reads an empty issue_id as
    # "no issue yet", so the hook went on to label, comment on and link issue "".
    - OUTPUT:
        message: "Story spec not found for '{story_key}' — common/story-title.yaml resolved none of its candidates ({spec_file}, {implementation_artifacts}/spec-*.md, {implementation_artifacts}/stories/*.md, {implementation_artifacts}/{story_key}.md) — cannot create issue"
        stop: true
  FALSE:
    - CHECK: empty story_title
      TRUE:
        - SET: { variable: story_title, value: "Untitled" }
    - WRITE:
        file: /tmp/issue-desc-{story_key}.md
        content: "**Sprint Key:** `{story_key}`\n**Epic:** {epic_num}\n**PRD:** {prd_key}\n\n---\n\n{story_body}"
        mode: overwrite
    - SET: { variable: title, value: "Story {epic_num}.{story_num}: {story_title}" }
    - SET: { variable: labels, value: "type{sep}story\nstatus{sep}ready-for-dev\nprd{sep}{prd_key}\n{prd_key}{sep}epic-{epic_num}" }
    - SET: { variable: description_file, value: "/tmp/issue-desc-{story_key}.md" }
    - SET: { variable: search_text, value: "{story_key}" }
    - INCLUDE: common/find-issue
    - CHECK: empty issue_id
      TRUE:
        - INCLUDE: common/create-issue
    - RUN: rm -f /tmp/issue-desc-{story_key}.md
