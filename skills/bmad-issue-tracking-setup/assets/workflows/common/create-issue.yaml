# common/create-issue.yaml
#
# Purpose: Searches for an existing issue by title, creates one if not found.
#           Extracts and returns the issue ID.
# Input variables:
#   - title: the exact issue title to search for (prefix match); passed as a `-f` field, never into the URL (the CLI percent-encodes it)
#   - labels: newline-separated list of labels to assign (e.g. "type::prd\nstatus::done")
#   - description_file: path to the file containing the issue description
# Output variables:
#   - issue_id: the IID (GitLab) or number (GitHub) of the created/found issue
# Side effects: creates an issue on the issue tracker if it does not already exist
# Requires: host and project in scope (provided by common/check-config via callers)

# Look up an existing issue with this title. The step prints the issue id, or an EMPTY
# string when there is none — the lookup must not be a FILTER: lang §5 stops the workflow
# when `where` matches nothing, and "no issue yet" is the normal case every story and epic
# goes through on its first sync (the PRD label alone makes the listing non-empty, so the
# `empty search_result` guard never catches it).
# The page stream is parsed with raw_decode because `--paginate` concatenates one JSON
# document per page with no separator: past 100 issues a plain parse dies on "Extra data".
- RUN: set -o pipefail; glab api --paginate "projects/{project_enc}/issues" --method GET -f "search={title}" -f "labels=prd{sep}{prd_key}" --hostname {host} | uv run --no-project python -c "
import json, sys
dec = json.JSONDecoder()
text = sys.stdin.read()
pos, pages = 0, []
while pos < len(text):
    if text[pos].isspace():
        pos += 1
        continue
    page, pos = dec.raw_decode(text, pos)
    pages.append(page)
issues = [i for page in pages for i in page]
print(str(issues[0]['iid']) if issues else '')
"
  STORE: found_issue_id
  PLATFORM: gitlab
# GitHub lists every issue carrying the PRD label, so the title comparison happens here:
# exact first, prefix second (the match the header promises). Pull requests share the
# issues endpoint and are dropped.
- RUN: set -o pipefail; gh api "repos/{project}/issues?state=all&per_page=100&labels=prd{sep}{prd_key}" --hostname {host} --paginate | uv run --no-project python -c "
import json, sys
dec = json.JSONDecoder()
text = sys.stdin.read()
pos, pages = 0, []
while pos < len(text):
    if text[pos].isspace():
        pos += 1
        continue
    page, pos = dec.raw_decode(text, pos)
    pages.append(page)
title = sys.argv[1]
issues = [i for page in pages for i in page if 'pull_request' not in i]
match = [i for i in issues if i['title'] == title] or [i for i in issues if i['title'].startswith(title)]
print(str(match[0]['number']) if match else '')
" "{title}"
  STORE: found_issue_id
  PLATFORM: github
# If found, adopt it as issue_id and stop
- CHECK: empty found_issue_id
  FALSE:
    - SET: { variable: issue_id, value: "{found_issue_id}" }
    - CHECK: empty issue_id
    TRUE:
      - STOP
    FALSE:
      - OUTPUT:
          message: "Issue already exists (#{issue_id}). Skipping creation."
      - STOP
# Create the issue
# Ensure all labels exist (static + dynamic like prd:{prd_key}, {prd_key}:epic-N)
- RUN: uv run --no-project python -c "
import sys
labels = sys.argv[1].strip().split('\n')
for label in labels:
    print(label)
" "{labels}"
  STORE: label_list
- LOOP:
    items: label_list
    as: label_name
    do:
      - INCLUDE: common/create-label
- RUN: uv run --no-project python -c "
import sys
labels = sys.argv[1].strip().split('\n')
print(','.join(labels))
" "{labels}"
  STORE: label_arg
- RUN: glab api --method POST "projects/{project_enc}/issues" --hostname {host} -f "title={title}" -F "description=@{description_file}" -f "labels={label_arg}"
  STORE: create_result
  PLATFORM: gitlab
- RUN: gh issue create --title "{title}" --body-file "{description_file}" --label "{label_arg}" -R "{host}/{project}"
  STORE: create_result
  PLATFORM: github
# Extract issue_id from creation result
- CHECK: platform eq "gitlab"
  TRUE:
    - FILTER:
        source: create_result
        select: iid
        store: issue_id
  FALSE:
    - FILTER:
        source: create_result
        select: number
        store: issue_id
