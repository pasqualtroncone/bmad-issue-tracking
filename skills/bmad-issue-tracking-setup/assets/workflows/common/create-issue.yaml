# common/create-issue.yaml
#
# Purpose: Searches for an existing issue by title, creates one if not found.
#           Extracts and returns the issue ID.
# Input variables:
#   - title: the exact issue title to search for (prefix match)
#   - labels: newline-separated list of labels to assign (e.g. "type::prd\nstatus::done")
#   - description_file: path to the file containing the issue description
# Output variables:
#   - issue_id: the IID (GitLab) or number (GitHub) of the created/found issue
#   - lookup_after_create: "true" after an issue was CREATED here (not after one was
#       adopted by title). common/find-issue.yaml reads it to decide whether its next
#       key-shaped GitHub lookup is worth re-checking; see the note at the end.
# Side effects: creates an issue on the issue tracker if it does not already exist;
#               creates every label in {labels} that the tracker does not have yet
#               (via common/create-label); writes and removes {description_file}.title
# Requires: host and project in scope (provided by common/check-config via callers)
#
# THE TITLE NEVER TOUCHES THE COMMAND LINE. Story titles come from user-typed spec
# frontmatter, where a double quote splits the command and a `$(…)` is executed before
# the CLI sees it. The title is written to a file with WRITE (no shell at all) and every
# step reads it back in python, which calls gh/glab with an ARGUMENT LIST.
#
# The staging file is named after {description_file}, which every caller already makes
# per-entity (/tmp/issue-desc-<key>.md, /tmp/prd-desc-<key>.md, ...). A FIXED /tmp path
# is not safe: the title is the identity this file dedupes by, so two hooks running at
# once could swap titles between one run's WRITE and its read.
#
# `capture_output=True` is what makes the argument list possible, and it also swallows the
# CLI's stderr — the ONLY place a create says why it failed (unknown label, missing scope,
# rate limit). Every wrapper below therefore catches CalledProcessError, writes e.stderr to
# its own stderr and exits with the CLI's code, so the step fails with the CLI's message
# instead of a traceback about a variable the caller never sees.

- WRITE:
    file: "{description_file}.title"
    content: "{title}"
    mode: overwrite
# Look up an existing issue with this title. The step prints the issue id, or an EMPTY
# string when there is none — the lookup must not be a FILTER: lang §5 stops the workflow
# when `where` matches nothing, and "no issue yet" is the normal case every story and epic
# goes through on its first sync (the PRD label alone makes the listing non-empty, so the
# `empty search_result` guard never catches it).
# The page stream is parsed with raw_decode because `--paginate` concatenates one JSON
# document per page with no separator: past 100 issues a plain parse dies on "Extra data".
# The listing is scoped by the PRD LABEL only, exactly like the GitHub sibling below. It
# used to carry `-f "search={title}"` as well, which put the title on the command line for
# nothing: `search=` is fuzzy on both trackers ("Story 1.1: Login Form" also returns
# Story 1.10), so the title had to decide here anyway — exact first, prefix second.
- RUN: set -o pipefail; glab api --paginate "projects/{project_enc}/issues" --method GET -f "labels=prd{sep}{prd_key}" --hostname {host} | uv run --no-project python -c "
import json, sys
dec = json.JSONDecoder()
text = sys.stdin.read()
pos, pages = 0, []
while pos < len(text):
    if text[pos].isspace():
        pos += 1
        continue
    page, pos = dec.raw_decode(text, pos)
    pages.append(page)
issues = [i for page in pages for i in page]
title = open(sys.argv[1], encoding='utf-8').read().strip()
match = [i for i in issues if (i.get('title') or '') == title] or [i for i in issues if (i.get('title') or '').startswith(title)]
print(str(match[0]['iid']) if match else '')
" "{description_file}.title"
  STORE: found_issue_id
  PLATFORM: gitlab
# GitHub lists every issue carrying the PRD label, so the title comparison happens here:
# exact first, prefix second (the match the header promises). Pull requests share the
# issues endpoint and are dropped.
- RUN: set -o pipefail; gh api "repos/{project}/issues?state=all&per_page=100&labels=prd{sep}{prd_key}" --hostname {host} --paginate | uv run --no-project python -c "
import json, sys
dec = json.JSONDecoder()
text = sys.stdin.read()
pos, pages = 0, []
while pos < len(text):
    if text[pos].isspace():
        pos += 1
        continue
    page, pos = dec.raw_decode(text, pos)
    pages.append(page)
title = open(sys.argv[1], encoding='utf-8').read().strip()
issues = [i for page in pages for i in page if 'pull_request' not in i]
match = [i for i in issues if i['title'] == title] or [i for i in issues if i['title'].startswith(title)]
print(str(match[0]['number']) if match else '')
" "{description_file}.title"
  STORE: found_issue_id
  PLATFORM: github
# If found, adopt it as issue_id and RETURN. The STOPs below are returns, not halts
# (lang section 2.10): the caller resumes after `INCLUDE: common/create-issue` with
# issue_id in scope and the creation block skipped. This one is a genuine early return —
# the rest of the file is the "no such issue yet" path — so it keeps its STOP.
- CHECK: empty found_issue_id
  FALSE:
    - SET: { variable: issue_id, value: "{found_issue_id}" }
    - RUN: rm -f "{description_file}.title"
    - CHECK: empty issue_id
      TRUE:
        - STOP
      FALSE:
        - OUTPUT:
            message: "Issue already exists (#{issue_id}). Skipping creation."
        - STOP
# Create the issue
# Ensure all labels exist (static + dynamic like prd:{prd_key}, {prd_key}:epic-N)
- RUN: uv run --no-project python -c "
import sys
labels = sys.argv[1].strip().split('\n')
for label in labels:
    print(label)
" "{labels}"
  STORE: label_list
# common/create-label.yaml branches on `empty label_color`, so the variable must be
# defined before the LOOP (lang §4.5). "" is the value this caller means: these labels
# take whatever colour the tracker picks, and a colour left in scope by an earlier
# common/ensure-dynamic-labels would otherwise paint them an epic's.
- SET: { variable: label_color, value: "" }
- LOOP:
    items: label_list
    as: label_name
    do:
      - INCLUDE: common/create-label
- RUN: uv run --no-project python -c "
import sys
labels = sys.argv[1].strip().split('\n')
print(','.join(labels))
" "{labels}"
  STORE: label_arg
- RUN: uv run --no-project python -c "
import subprocess, sys
title = open(sys.argv[1], encoding='utf-8').read().strip()
try:
    out = subprocess.run(['glab', 'api', '--method', 'POST', 'projects/{project_enc}/issues', '--hostname', '{host}', '-f', 'title=' + title, '-F', 'description=@{description_file}', '-f', 'labels={label_arg}'], capture_output=True, text=True, check=True).stdout
except subprocess.CalledProcessError as e:
    sys.stderr.write(e.stderr or '')
    sys.exit(e.returncode or 1)
print(out.strip())
" "{description_file}.title"
  STORE: create_result
  PLATFORM: gitlab
- RUN: uv run --no-project python -c "
import subprocess, sys
title = open(sys.argv[1], encoding='utf-8').read().strip()
try:
    out = subprocess.run(['gh', 'issue', 'create', '--title', title, '--body-file', '{description_file}', '--label', '{label_arg}', '-R', '{host}/{project}'], capture_output=True, text=True, check=True).stdout
except subprocess.CalledProcessError as e:
    sys.stderr.write(e.stderr or '')
    sys.exit(e.returncode or 1)
print(out.strip())
" "{description_file}.title"
  STORE: create_result
  PLATFORM: github
# Extract issue_id from creation result.
# The two CLIs answer in different shapes and only one of them is JSON. `glab api
# --method POST` prints the created issue as a JSON object, so a FILTER reads `iid`
# straight off it. `gh issue create` prints ONE LINE: the issue's web URL
# (https://<host>/<owner>/<repo>/issues/<n>). A FILTER for `number` finds no such field
# and lang §5 stops the workflow there — after the issue exists — so the status label,
# the comment and the MR description's issue_ref were all skipped, silently: the next
# run adopts the issue by exact title, so nothing ever reported the gap. The GitHub
# branch therefore reads the trailing integer of the URL instead.
- CHECK: platform eq "gitlab"
  TRUE:
    - FILTER:
        source: create_result
        select: iid
        store: issue_id
  FALSE:
    - RUN: uv run --no-project python -c "
import re, sys
m = re.search(r'([0-9]+)[^0-9]*\Z', sys.argv[1].strip())
print(m.group(1) if m else '')
" "{create_result}"
      STORE: issue_id
- RUN: rm -f "{description_file}.title"
# An unreadable create output is a halt WITH a reason, not a silent skip: every caller
# treats an empty issue_id as "no issue yet" and would go on to label, comment on and
# link an issue id that is the empty string.
- CHECK: empty issue_id
  TRUE:
    - OUTPUT:
        message: "Issue created but its id could not be read from the create output: {create_result}"
        stop: true
# An issue was just created. Neither GitHub endpoint is read-your-writes (3.7-7.7 s on the
# lab), so a find-issue LATER IN THIS RUN — post-dev-complete asks for the story issue
# again after ensure-issue created it — can read an empty issue_id and skip the status
# update. The flag tells common/find-issue.yaml that its next key-shaped GitHub lookup may
# be racing this create and is worth re-checking; find-issue consumes it after that one
# lookup, so no OTHER miss pays for it. The adopt branch above STOPs before this line: an
# issue found by title was not created here and nothing is racing it.
- SET: { variable: lookup_after_create, value: "true" }
