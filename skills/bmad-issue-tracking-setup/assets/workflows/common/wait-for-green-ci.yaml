# common/wait-for-green-ci.yaml
#
# Purpose: Waits for CI to pass on the current branch's MR/PR.
#          On failure, fetches failed-job diagnostics and instructs the agent to fix.
# Input variables:
#   - current_branch: the source branch to check
#   - git_platform: "gitlab" or "github" (from check-config)
#   - platform: issue tracker platform (from check-config)
#   - host: issue tracker host (from check-config)
#   - project: issue tracker project (from check-config)
#   - git_host, git_project_enc: the GIT REMOTE's hostname and URL-encoded project path
#       (from check-config) — the pipeline belongs to the remote, not to the tracker
#   - mr_repo: the GIT REMOTE's "host/project" (from check-config)
#   - source_branch: source branch (set by check-mr-ci, defaults to current_branch). On GitHub
#       it is also the `gh run list --branch` filter: without it the poll reads the newest run
#       of the whole repo, i.e. some other branch's pipeline.
# Output variables:
#   - ci_status: "passed", "no_ci", "no_mr", "running", "failed", "timeout"
#   - pipeline_id: id of the failed pipeline (set on failure-path, passed to get-failed-jobs)
#   - jobs: failed-job diagnostics from get-failed-jobs (TSV on gitlab, raw text on github)
# Side effects: polls CI every 25s while running, in 9 bounded rounds of 8 polls each
#   (one RUN blocks ~200s and never more than ~240s; 30 min of wall clock in total);
#   on failure, fetches failed-job traces
#
# Platform selection: CI belongs to the GIT REMOTE, so every poll RUN and the failure-path
# lookup are chosen by `CHECK: git_platform eq "gitlab"` and carry NO `PLATFORM:`
# annotation. They used to carry one, and `PLATFORM:` compares against `platform`, the
# ISSUE TRACKER (lang §2.4): on a cross-platform setup the enclosing CHECK picked the
# right branch and the annotation then skipped its RUN, so the round stored nothing, the
# loop saw ci_status still "running" for all nine rounds and reported a 30-minute timeout.

# Initial check (atomic; produces mr_iid + pipeline_id + pipeline_status + ci_status)
- INCLUDE: common/check-mr-ci
# Already green or no CI — proceed
- CHECK: ci_status eq "passed"
  TRUE:
    - STOP
- CHECK: ci_status eq "no_ci"
  TRUE:
    - STOP
- CHECK: ci_status eq "no_mr"
  TRUE:
    - STOP
# CI running — poll until terminal state (budget: 9 rounds x 200 s = 30 min).
#
# The long wait is expressed as a LOOP in the workflow language, NOT as one long-running
# bash loop: the interpreter executes every RUN through a tool that times out (120 s by
# default, 600 s at most), so a single RUN that blocks for the whole budget is killed
# before it prints anything, ci_status is never stored and common/write-ci-status never
# writes ci-status.json. Each iteration below runs ONE bounded RUN of at most 8 polls
# x 25 s; the LOOP supplies the repetition.
#
# poll_rounds is the literal list 1 2 3 4 5 6 7 8 9, one number per line. The numbers are
# never read — they only make the LOOP body run nine times.
#
# Once ci_status is terminal the CHECK inside the body is false, so the remaining
# iterations do nothing and cost no wall clock.
#
# Inside a round we replicate the SAME logic that common/get-mr-pipeline encodes — that
# atomic remains the canonical source for the single-fetch case (e.g. the check-mr-ci
# initial check). mr_iid is reused from the initial check-mr-ci INCLUDE above (the MR is
# not re-resolved per poll).
- SET: { variable: poll_rounds, value: "1\n2\n3\n4\n5\n6\n7\n8\n9" }
- LOOP:
    items: poll_rounds
    as: poll_round
    do:
      - CHECK: ci_status eq "running"
        TRUE:
          - CHECK: git_platform eq "gitlab"
            TRUE:
              - RUN: |
                  polls_per_round=8
                  poll=0
                  STATUS=running
                  while [ $poll -lt $polls_per_round ]; do
                    sleep 25
                    poll=$((poll + 1))
                    # get-mr-pipeline equivalent: fetch latest pipeline for the existing mr_iid
                    raw=$(glab api "projects/{git_project_enc}/merge_requests/{mr_iid}/pipelines" --hostname {git_host} --paginate 2>/dev/null)
                    pipeline_status=$(echo "$raw" | uv run --no-project python -c "
import json, sys
ps = json.load(sys.stdin)
print(ps[0]['status'] if ps else 'none')
" 2>/dev/null)
                    # Map atomic pipeline_status -> ci_status enum (mirrors check-mr-ci L41-54)
                    STATUS=$(uv run --no-project python -c "
import sys
ps = sys.argv[1].strip() if len(sys.argv) > 1 else ''
if ps == 'success':
    print('passed')
elif ps in ('failed', 'failure'):
    print('failed')
elif ps in ('running', 'pending', 'queued', 'in_progress'):
    print('running')
else:
    print('no_ci')
" "$pipeline_status")
                    # An unreadable answer counts as "still running": the round budget,
                    # not a parse error, decides when to give up. An empty STATUS would
                    # store an empty ci_status matching none of the branches below.
                    [ -n "$STATUS" ] || STATUS=running
                    if [ "$STATUS" != "running" ]; then
                      break
                    fi
                  done
                  echo "$STATUS"
                STORE: ci_status
            FALSE:
              - CHECK: git_platform eq "github"
                TRUE:
                  - RUN: |
                      polls_per_round=8
                      poll=0
                      STATUS=running
                      while [ $poll -lt $polls_per_round ]; do
                        sleep 25
                        poll=$((poll + 1))
                        # get-mr-pipeline equivalent: latest workflow run of the MR's source branch
                        # (--branch is mandatory: without it this reads the repo's newest run, any branch)
                        raw=$(gh run list --limit 1 --branch "{source_branch}" -R "{mr_repo}" --json databaseId,status,conclusion 2>/dev/null)
                        pipeline_status=$(echo "$raw" | uv run --no-project python -c "
import json, sys
rs = json.load(sys.stdin)
print((rs[0]['conclusion'] or rs[0]['status'] or 'unknown') if rs else 'none')
" 2>/dev/null)
                        # Map atomic pipeline_status -> ci_status enum (mirrors check-mr-ci L41-54)
                        STATUS=$(uv run --no-project python -c "
import sys
ps = sys.argv[1].strip() if len(sys.argv) > 1 else ''
if ps == 'success':
    print('passed')
elif ps in ('failed', 'failure'):
    print('failed')
elif ps in ('running', 'pending', 'queued', 'in_progress'):
    print('running')
else:
    print('no_ci')
" "$pipeline_status")
                        # An unreadable answer counts as "still running" (see the gitlab branch)
                        [ -n "$STATUS" ] || STATUS=running
                        if [ "$STATUS" != "running" ]; then
                          break
                        fi
                      done
                      echo "$STATUS"
                    STORE: ci_status
# Still "running" after the ninth round — the 30-minute budget is spent
- CHECK: ci_status eq "running"
  TRUE:
    - SET: { variable: ci_status, value: "timeout" }
# After polling — check if passed or failed
- CHECK: ci_status eq "passed"
  TRUE:
    - STOP
- CHECK: ci_status eq "no_ci"
  TRUE:
    - STOP
# CI timed out after 30 minutes
- CHECK: ci_status eq "timeout"
  TRUE:
    - OUTPUT:
        message: "CI did not reach a terminal state after 30 minutes. Check the pipeline manually and re-run this workflow when resolved."
        stop: true
# CI failed — fetch pipeline_id then INCLUDE the get-failed-jobs atomic for diagnostics.
# The jobs output is TSV on gitlab (name\texit_code\ttrace_tail per line) and raw
# `gh run view --log-failed` text on github — we display it as-is without parsing.
- CHECK: ci_status eq "failed"
  TRUE:
    - CHECK: git_platform eq "gitlab"
      TRUE:
        - RUN: glab api "projects/{git_project_enc}/merge_requests/{mr_iid}/pipelines" --hostname {git_host} --paginate | uv run --no-project python -c "
import json, sys
ps = json.load(sys.stdin)
print(str(ps[0]['id']) if ps else '')
"
          STORE: pipeline_id
      FALSE:
        - RUN: gh run list --limit 1 --branch "{source_branch}" -R "{mr_repo}" --json databaseId | uv run --no-project python -c "
import json, sys
rs = json.load(sys.stdin)
print(str(rs[0]['databaseId']) if rs else '')
"
          STORE: pipeline_id
    - INCLUDE: common/get-failed-jobs
    - OUTPUT:
        message: "CI failed (pipeline {pipeline_id}).\n\nFailed-job diagnostics:\n{jobs}\n\nRead the CI logs, fix the issue, then:\n1. git add .\n2. git commit -m \"fix: ci failure\"\n3. git push\n4. Re-run this workflow (INCLUDE: common/wait-for-green-ci)"
