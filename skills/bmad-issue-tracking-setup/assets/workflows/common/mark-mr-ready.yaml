# common/mark-mr-ready.yaml
#
# Purpose: Marks the draft MR/PR for the PRD branch as ready when all epics are done.
#           Does nothing if not all epics are done or if no draft MR/PR exists.
# Input variables: (none — uses platform, git_platform, mr_repo, prd_key, branch_patterns
#   from scope; mr_repo is the git remote's "host/project", resolved once by check-config)
# Output variables: (none)
# Side effects: marks the draft MR/PR ready on the GIT REMOTE (the MR does not live on
#   the issue tracker)

# Check if all epics have status "done"
- READ: {implementation_artifacts}/sprint-status.yaml
  EXTRACT:
    entries: development_status
- RUN: uv run --no-project python -c "
import sys, re
content = sys.argv[1]
all_done = True
epic_found = False
for line in content.split('\n'):
    m = re.match(r'\s*(epic-\d+)(?!-retrospective)\S*\s*:\s*(.+)$', line.strip())
    if m:
        epic_found = True
        status = m.group(2).strip()
        if status != 'done':
            all_done = False
            break
print('yes' if all_done and epic_found else 'no')
" {entries}
  STORE: all_epics_done
# Not-all-epics-done is the ordinary case on every sync but the last, so it carries no
# steps at all: the file ends and the caller goes on. The guard used to read
# `ne "yes" -> STOP`, a bare early return that an interpreter taking lang section 2.10
# literally turned into a halt of the whole sync.
- CHECK: all_epics_done eq "yes"
  TRUE:
    # Resolve the PRD branch — the source branch whose MR/PR is marked ready
    - READ: _bmad/custom/issue-tracking.yaml
      EXTRACT:
        prd_pattern: issue_tracking.branch_patterns.prd
    - RUN: uv run --no-project python -c "
import sys
print(sys.argv[1].replace('{prd_key}', sys.argv[2]))
" {prd_pattern} {prd_key}
      STORE: prd_branch
    # mr_repo (the git remote's "host/project") comes from check-config; `gh -R` and
    # `glab -R` take owner/repo whole, so it is never split.
    # Find MR/PR by source branch (atomic returns mr_iid, empty if none)
    - SET: { variable: source_branch, value: "{prd_branch}" }
    - INCLUDE: common/find-mr
    # Mark draft MR/PR ready
    - CHECK: git_platform eq "gitlab"
      TRUE:
        - CHECK: empty mr_iid
          TRUE:
            - OUTPUT:
                message: "All epics done, but no draft MR found."
          FALSE:
            - RUN: glab mr update {mr_iid} --ready -R "{mr_repo}"
              EXPECT_EXIT: 0
            - OUTPUT:
                message: "All epics done — draft MR marked as ready for review."
      FALSE:
        - CHECK: empty mr_iid
          TRUE:
            - OUTPUT:
                message: "All epics done, but no draft PR found."
          FALSE:
            - RUN: gh pr ready {mr_iid} -R "{mr_repo}"
              EXPECT_EXIT: 0
            - OUTPUT:
                message: "All epics done — draft PR marked as ready for review."
