# common/check-mr-ci.yaml
#
# Purpose: Checks the CI pipeline status for the current branch's MR/PR.
# Input variables:
#   - current_branch: the source branch to check
#   - git_platform: "gitlab" or "github" (from check-config)
#   - platform: issue tracker platform (from check-config)
#   - mr_repo: the GIT REMOTE's "host/project" (from check-config, which resolves the
#       remote's coordinates once — they are the tracker's whenever the platforms agree)
#   - git_host, git_project_enc: the GIT REMOTE's hostname and URL-encoded project path
#       (from check-config) — the GitLab CI definition is read off the project API
# Output variables:
#   - ci_status: "passed", "failed", "running", "no_ci", "no_mr"
#   - ci_defined: "true" when the branch carries a CI definition, "false" otherwise —
#       what tells "no run YET" from "this repo has no CI". GitLab reads the project's
#       `ci_config_path` first (it may name another file, or a file in another repo) and
#       falls back to .gitlab-ci.yml; GitHub reads .github/workflows/*.yml
# Side effects: none

# mr_repo comes from check-config, which resolves the git remote's coordinates once
# (they are the tracker's whenever git_platform eq platform). This file used to resolve
# it again here, and three other callers each had their own copy of the same block.
# Find the MR + fetch its latest pipeline. Atomics self-route via PLATFORM.
# Note: get-mr-pipeline's GitHub side uses `gh run list` (workflow-run-level) rather
# than the previous `gh pr checks` (per-check aggregation) — a known semantic shift
# acknowledged in the plan's out-of-scope section ("both coexist" as concepts).
- SET: { variable: source_branch, value: "{current_branch}" }
- INCLUDE: common/find-mr
- INCLUDE: common/get-mr-pipeline
# Map atomic outputs to the unified ci_status enum: empty mr_iid -> no_mr; otherwise the
# raw pipeline_status decides, with "no pipeline at all" resolved by ci_defined.
# "The run list is empty" is NOT "this repo has no CI". `gh run list --branch <src>`
# answers [] for the first seconds after a push, before Actions registers the run, and a
# GitLab MR has no pipeline until the hook fires; get-mr-pipeline reports `none` and an
# empty pipeline_id for both. Mapping that to `no_ci` made wait-for-green-ci STOP green —
# and review-finish pushes and gates in the same breath, so ci-status.json was written
# green while the run that would fail had not started yet.
# The discriminator is the CI DEFINITION on the branch, read from the worktree the hook
# is running in: a repo with no `.gitlab-ci.yml` / `.github/workflows/*.yml` is genuinely
# CI-less and stays green at no cost, while a repo that has one waits for its run.
- CHECK: empty mr_iid
  TRUE:
    - SET: { variable: ci_status, value: "no_mr" }
  FALSE:
    - CHECK: git_platform eq "gitlab"
      TRUE:
        # `test -f .gitlab-ci.yml` alone misreads every project whose `ci_config_path`
        # names another file in the repo, or a file in another repo: the branch DOES
        # define a pipeline, the empty list seconds after a push is a run that has not
        # started, and calling that `no_ci` ends the gate green — the race below, again.
        # The project API answers what GitLab itself uses; the local file stays the
        # fallback for a project the API cannot be asked about (no token, no network),
        # so a genuinely CI-less project is still `false` and still green at no cost.
        - RUN: uv run --no-project python -c "
import json, os, subprocess
try:
    raw = subprocess.run(['glab', 'api', 'projects/{git_project_enc}', '--hostname', '{git_host}'], capture_output=True, text=True, check=True).stdout
    configured = bool((json.loads(raw).get('ci_config_path') or '').strip())
except Exception:
    configured = False
print('true' if (configured or os.path.exists('.gitlab-ci.yml')) else 'false')
"
          STORE: ci_defined
      FALSE:
        - RUN: ls .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null | head -1 | grep -q . && echo true || echo false
          STORE: ci_defined
    - RUN: uv run --no-project python -c "
import sys
ps = sys.argv[1].strip() if len(sys.argv) > 1 else ''
defined = (sys.argv[2].strip() if len(sys.argv) > 2 else '') == 'true'
# GitLab pipeline.status: success/failed/running/pending/canceled/skipped/created/manual
# GitHub conclusion/status: success/failure/cancelled/skipped/timed_out/queued/in_progress/...
if ps == 'success':
    print('passed')
elif ps in ('failed', 'failure'):
    print('failed')
elif ps in ('running', 'pending', 'queued', 'in_progress'):
    print('running')
elif ps in ('none', ''):
    # no run at all: still coming if this branch defines CI, absent for good if it does not
    print('running' if defined else 'no_ci')
else:
    print('no_ci')
" "{pipeline_status}" "{ci_defined}"
      STORE: ci_status