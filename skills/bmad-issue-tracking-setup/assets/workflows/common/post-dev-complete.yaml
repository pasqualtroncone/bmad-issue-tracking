# common/post-dev-complete.yaml
#
# Purpose: Unified post-completion workflow handling the full issue tracking lifecycle
#          for a story: push code, wait CI, update issue status, post comments, create MR.
# Dispatched by phase:
#   - "create-story": spec just created, no code yet — create issue + commit + push + create trace MR
#   - "dev-finish":    dev session done — push + issue + MR + wait CI + write ci-status.json + update issue + post dev comment
#   - "review-finish": review session done — push + wait CI + post review findings + update issue final + optional merge
# Input variables:
#   - phase: "create-story" | "dev-finish" | "review-finish" (set by dispatcher or caller)
#   - ci_status: set by common/wait-for-green-ci (dev-finish, review-finish) — maps to ci-status.json
#   - pipeline_id: set by common/wait-for-green-ci on failure — carried into ci-status.json diagnostic
#   - jobs: set by common/get-failed-jobs (via wait-for-green-ci) on failure — carried into ci-status.json diagnostic
# Output variables:
#   - issue_id: the issue IID (GitLab) or number (GitHub)
# Side effects: pushes branch, writes {worktree}/ci-status.json (dev-finish), creates/updates issues on tracker, creates/merges MR

- INCLUDE: common/check-config
- INCLUDE: common/find-prd-key
# Capture worktree root (ci-status.json is written here for bmad-loop's verify command)
- RUN: pwd
  STORE: worktree
# Derive issue metadata from current branch and spec
- READ: {planning_artifacts}/prd.md
  EXTRACT:
    prd_key: frontmatter.prd_key
- RUN: git branch --show-current
  STORE: current_branch
- RUN: uv run --no-project python -c "
import sys
branch = sys.argv[1]
parts = branch.rstrip().split('/')
if len(parts) >= 3:
    print(parts[-1])
else:
    print(branch)
" {current_branch}
  STORE: story_key
- CHECK: empty story_key
  TRUE:
    - OUTPUT:
        message: "Could not determine story_key from branch '{current_branch}'."
        stop: true
- RUN: uv run --no-project python -c "
import sys
parts = sys.argv[1].split('-')
print(parts[0])
" {story_key}
  STORE: epic_num
- RUN: uv run --no-project python -c "
import sys
parts = sys.argv[1].split('-')
print(parts[1])
" {story_key}
  STORE: story_num
- READ: _bmad/custom/issue-tracking.yaml
  EXTRACT:
    prd_pattern: issue_tracking.branch_patterns.prd
    story_pattern: issue_tracking.branch_patterns.story
- RUN: uv run --no-project python -c "
import sys
print(sys.argv[1].replace('{prd_key}', sys.argv[2]))
" {prd_pattern} {prd_key}
  STORE: prd_branch
- RUN: uv run --no-project python -c "
import sys
pattern = sys.argv[1]
key = sys.argv[2]
pk = sys.argv[3]
print(pattern.replace('{prd_key}', pk).replace('{story_key}', key))
" {story_pattern} {story_key} {prd_key}
  STORE: story_branch
# =============================================================================
# PHASE 1: create-story — spec just created, no code yet
# =============================================================================
- CHECK: phase eq "create-story"
  TRUE:
    # Ensure issue exists (find or create) with the story spec body
    - INCLUDE: common/ensure-issue
    # Commit and push
    
    - RUN: git commit --allow-empty -m "create story {story_key}" 2>/dev/null || true
    - RUN: git push -u origin {story_branch}
    # common/ensure-mr reads its inputs from the caller's scope, so they are set here.
    # source_branch is the branch we are ON, never the pattern-derived story_branch:
    # bmad-loop names its branches bmad-loop/<run>/<story_key>, a ref no pattern spells.
    # mr_repo (the git remote's "host/project") comes from check-config.
    - SET: { variable: source_branch, value: "{current_branch}" }
    - SET: { variable: target_branch, value: "{prd_branch}" }
    - SET: { variable: mr_title, value: "Story {epic_num}.{story_num}: {story_key}" }
    - WRITE:
        file: /tmp/ensure-mr-desc-{story_key}.md
        content: "Sprint key: {story_key}\n\nRelated to #{issue_id}"
        mode: overwrite
    - SET: { variable: mr_description_file, value: "/tmp/ensure-mr-desc-{story_key}.md" }
    - SET: { variable: mr_draft, value: "false" }
    # Ensure trace MR exists (create if missing, with issue reference)
    - INCLUDE: common/ensure-mr
    - RUN: rm -f /tmp/ensure-mr-desc-{story_key}.md
    - OUTPUT:
        message: "Story {story_key} issue created and MR ready."
# =============================================================================
# PHASE 2: dev-finish — dev session done, code pushed, CI run
# =============================================================================
- CHECK: phase eq "dev-finish"
  TRUE:
    # Read sprint-status to determine the target status for this story
    - READ: {implementation_artifacts}/sprint-status.yaml
      EXTRACT:
        entries: development_status
    - FILTER:
        source: entries
        select: value
        where: key eq "{story_key}"
        store: story_status
    # Push any remaining local commits
    
    - RUN: git commit --allow-empty -m "dev {story_key}" 2>/dev/null || true
    - RUN: git push -u origin HEAD
    # Ensure issue exists (find or create)
    - INCLUDE: common/ensure-issue
    # common/ensure-mr reads its inputs from the caller's scope, so they are set here.
    # source_branch is the branch we are ON, never the pattern-derived story_branch:
    # bmad-loop names its branches bmad-loop/<run>/<story_key>, a ref no pattern spells.
    # mr_repo (the git remote's "host/project") comes from check-config.
    - SET: { variable: source_branch, value: "{current_branch}" }
    - SET: { variable: target_branch, value: "{prd_branch}" }
    - SET: { variable: mr_title, value: "Story {epic_num}.{story_num}: {story_key}" }
    - WRITE:
        file: /tmp/ensure-mr-desc-{story_key}.md
        content: "Sprint key: {story_key}\n\nRelated to #{issue_id}"
        mode: overwrite
    - SET: { variable: mr_description_file, value: "/tmp/ensure-mr-desc-{story_key}.md" }
    - SET: { variable: mr_draft, value: "false" }
    # Ensure trace MR exists (create if missing)
    - INCLUDE: common/ensure-mr
    - RUN: rm -f /tmp/ensure-mr-desc-{story_key}.md
    # Wait CI + write ci-status.json (contract for ci-status.sh).
    #
    # The gate comes AFTER the MR, and the order is the gate. On the first dev-finish of
    # a story there is no PR yet: check-mr-ci mapped `no_mr`, write-ci-status wrote
    # {"status": "green"}, and only then did ensure-mr create the PR. Under bmad-loop the
    # first [verify] therefore passed whatever CI did, and a red pipeline was first seen
    # one pass later. With the MR ensured first, wait-for-green-ci has something to gate
    # on the first time round. `no_mr` still means green — that is the flow with no
    # remote MR at all, where there is no gate to enforce, not a story whose MR simply
    # had not been created yet.
    - INCLUDE: common/wait-for-green-ci
    - INCLUDE: common/write-ci-status
    # Update issue status based on sprint-status
    - CHECK: story_status eq "review"
      TRUE:
        - SET: { variable: new_status, value: "review" }
        - SET: { variable: close, value: "false" }
        - INCLUDE: common/update-issue-status
        - OUTPUT:
            message: "Provide a brief implementation summary for the review comment (what was implemented, key changes, notes for the reviewer). Write the full comment body to /tmp/dev-story-comment-{story_key}.md using markdown format."
        - RUN: test -f /tmp/dev-story-comment-{story_key}.md && echo "yes" || echo "no"
          STORE: comment_file_exists
          EXPECT_EXIT: any
        - CHECK: comment_file_exists eq "yes"
          TRUE:
            - CHECK: empty issue_id
              FALSE:
                - SET: { variable: comment_file, value: "/tmp/dev-story-comment-{story_key}.md" }
                - INCLUDE: common/post-issue-comment
            - RUN: rm -f /tmp/dev-story-comment-{story_key}.md
    - CHECK: story_status eq "done"
      TRUE:
        - SET: { variable: new_status, value: "done" }
        - SET: { variable: close, value: "true" }
        - INCLUDE: common/update-issue-status
    - CHECK: story_status ne "review"
      TRUE:
        - CHECK: story_status ne "done"
          TRUE:
            - SET: { variable: new_status, value: "in-progress" }
            - SET: { variable: close, value: "false" }
            - INCLUDE: common/update-issue-status
    - OUTPUT:
        message: "Story {story_key} dev-finish complete."
# =============================================================================
# PHASE 3: review-finish — review session done, post findings + update final
# =============================================================================
- CHECK: phase eq "review-finish"
  TRUE:
    # Read sprint-status to determine the review verdict
    - READ: {implementation_artifacts}/sprint-status.yaml
      EXTRACT:
        review_status: development_status.{story_key}
    # The CI gate below only runs when the verdict is `done`, and lang section 4.5 stops a
    # run on a CHECK that reads an undefined variable. Seed the verdict as "no verdict":
    # the merge guard reads it, and "no verdict" must never be a green one.
    - SET: { variable: ci_status, value: "" }
    # Commit and push any review modifications
    
    - RUN: git commit --allow-empty -m "code review {story_key}" 2>/dev/null || true
    - RUN: git push -u origin HEAD
    # Find issue
    - SET: { variable: search_text, value: "{story_key}" }
    - INCLUDE: common/find-issue
    # Update issue status based on review verdict
    - CHECK: review_status eq "done"
      TRUE:
        - SET: { variable: new_status, value: "done" }
        - SET: { variable: close, value: "true" }
        - INCLUDE: common/update-issue-status
      FALSE:
        - SET: { variable: new_status, value: "in-progress" }
        - SET: { variable: close, value: "false" }
        - INCLUDE: common/update-issue-status
    # Post review findings as comment on issue.
    #
    # The spec is resolved by common/story-title.yaml, the one file that owns the rule —
    # {spec_path} hint, {spec_file}, the sprint-mode spec-<storyId>-<slug>.md, the
    # stories-mode stories/<id>-<slug>.md, and the legacy
    # {implementation_artifacts}/{story_key}.md last. This block used to try only the last
    # two, the pair #72 removed from ensure-issue for the same reason: the slug comes from
    # the story TITLE, so in sprint mode with an empty {spec_file} neither candidate
    # exists, SPEC_NOT_FOUND halts the run, and the CI gate, the ci-status write and the
    # merge die with it while the spec sits at spec-1-1-login-form.md.
    #
    # Two producers write two different sections into the same file:
    #   bmad-build-auto  -> '## Review Triage Log' with '### <date> — Review pass' rows
    #   bmad-code-review -> '### Review Findings'
    # Both are accepted; the triage log wins when both are present, because it is the
    # only section a producer guarantees on every pass.
    #
    # A MISSING file always halts — that case is unambiguous. A missing or empty SECTION
    # halts only when review_producer eq "bmad-build-auto"; every other flow warns and
    # goes on, because their reviews legitimately write nothing when they find nothing.
    - CHECK: empty issue_id
      FALSE:
        # spec_path is seeded empty: this phase has no path of its own to offer, and the
        # atomic must not adopt one an earlier INCLUDE left in scope.
        - SET: { variable: spec_path, value: "" }
        - INCLUDE: common/story-title
        - RUN: uv run --no-project python -c "
import sys, re, pathlib
given = sys.argv[1].strip() if len(sys.argv) > 1 else ''
path = pathlib.Path(given) if given else None
if path is None or not path.is_file():
    print('SPEC_NOT_FOUND')
    sys.exit(0)
content = path.read_text()
match = re.search(r'(^## Review Triage Log\s*$.*?)(?=\n## |\Z)', content, re.DOTALL | re.MULTILINE)
if not match:
    match = re.search(r'(^### Review Findings.*?)(?=\n## |\Z)', content, re.DOTALL | re.MULTILINE)
if not match:
    print('SPEC_NO_REVIEW_SECTION')
    sys.exit(0)
body = re.sub(r'<!--[\s\S]{0,2000}?-->', '', match.group(1)).strip()
# Strip HTML comments FIRST: the template ships an explanatory one under the heading,
# so leaving it in would make an unrun review look non-empty AND would post the
# template's own text as the issue comment. What remains must have real rows.
if not re.sub(r'^#+ .*$', '', body, flags=re.MULTILINE).strip():
    print('SPEC_EMPTY_REVIEW_SECTION')
    sys.exit(0)
print(body)
" "{spec_path}"
          STORE: review_section
        - CHECK: review_section eq "SPEC_NOT_FOUND"
          TRUE:
            - OUTPUT:
                message: "No spec file found for '{story_key}' — common/story-title.yaml resolved none of its candidates ({spec_file}, {implementation_artifacts}/spec-*.md, {implementation_artifacts}/stories/*.md, {implementation_artifacts}/{story_key}.md), so no spec was produced for this story. Nothing was posted and the merge must not proceed. Check what bmad-build-auto actually wrote on disk (sprint mode names it spec-<storyId>-<slug>.md)."
                stop: true
        # Halt ONLY when the producer is known to always write a section. That is
        # bmad-build-auto alone: its step-04 appends a review-log entry on EVERY pass.
        # The other two producers that reach this file write nothing on a clean review
        # (bmad-build: one row per finding; bmad-code-review via its on_complete hook),
        # so for them a missing section is legitimate and only warns.
        # review_producer is set by common/post-build-dispatch-auto.yaml — a workflow
        # step, not hook prose — and seeded "" by the other three entry wrappers, because
        # lang §4.5 stops a run on a CHECK that reads an undefined variable. allow_merge
        # cannot be used for this: it marks the interactive merge prompt and is "" on
        # BOTH the unattended and the bmad-code-review paths.
        #
        # The warn branch must clear review_section: the block below posts whatever the
        # variable holds, so leaving the sentinel there would post the literal string
        # SPEC_NO_REVIEW_SECTION as the issue comment.
        - CHECK: review_section eq "SPEC_NO_REVIEW_SECTION"
          TRUE:
            - CHECK: review_producer eq "bmad-build-auto"
              TRUE:
                - OUTPUT:
                    message: "No review section in the spec. The unattended review appends a '### <date> — Review pass' entry on every pass, so its absence means the review step never ran. Refusing to merge an unreviewed story. Looked for '## Review Triage Log' and '### Review Findings'."
                    stop: true
              FALSE:
                - OUTPUT:
                    message: "WARNING: no review section in the spec — looked for '## Review Triage Log' and '### Review Findings'. No comment posted. Not treated as an error on this flow, whose review legitimately writes nothing when it finds nothing."
                - SET: { variable: review_section, value: "" }
        - CHECK: review_section eq "SPEC_EMPTY_REVIEW_SECTION"
          TRUE:
            - CHECK: review_producer eq "bmad-build-auto"
              TRUE:
                - OUTPUT:
                    message: "The review section exists but has no rows — the unattended review always appends one, so this review never ran. Refusing to merge an unreviewed story."
                    stop: true
              FALSE:
                - OUTPUT:
                    message: "WARNING: the review section has no rows — no comment posted. Not treated as an error on this flow, for the same reason."
                - SET: { variable: review_section, value: "" }

        - CHECK: empty review_section
          FALSE:
            - WRITE:
                file: /tmp/review-findings-{story_key}.md
                content: "{review_section}"
            - SET: { variable: comment_file, value: "/tmp/review-findings-{story_key}.md" }
            - INCLUDE: common/post-issue-comment
            - RUN: rm -f /tmp/review-findings-{story_key}.md
    # CI gate before merge + write ci-status.json (contract for ci-status.sh)
    - CHECK: review_status eq "done"
      TRUE:
        - INCLUDE: common/wait-for-green-ci
        - INCLUDE: common/write-ci-status
    # Is the CI verdict one that may be merged? The green set is
    # common/write-ci-status.yaml's: `passed` is a real green pipeline, `no_ci`/`no_mr` are
    # the flows with no gate to enforce. Everything else — `failed`, `timeout`, and the ""
    # of a review that did not end `done` — is not. The gate matters since #75: the timeout
    # path now returns instead of ending the run, so without this the prompt would offer to
    # merge a story whose pipeline never finished.
    - SET: { variable: ci_merge_ok, value: "false" }
    - CHECK: ci_status eq "passed"
      TRUE:
        - SET: { variable: ci_merge_ok, value: "true" }
    - CHECK: ci_status eq "no_ci"
      TRUE:
        - SET: { variable: ci_merge_ok, value: "true" }
    - CHECK: ci_status eq "no_mr"
      TRUE:
        - SET: { variable: ci_merge_ok, value: "true" }
    # Optional merge — only in interactive flows (bmad-build manual), never in unattended (bmad-build-auto)
    - CHECK: allow_merge eq "true"
      TRUE:
        - CHECK: ci_merge_ok eq "true"
          TRUE:
            - OUTPUT:
                message: "Merge the story MR now? (yes/no)"
                store: do_merge
            - CHECK: do_merge eq "yes"
              TRUE:
                # Resolve mr_iid via the existing source_branch (atomic sets mr_iid in scope).
                # source_branch is set by common/check-mr-ci inside wait-for-green-ci (called
                # above when review_status eq "done"); mr_repo comes from check-config.
                - INCLUDE: common/find-mr
                # No cross-platform seeding here: common/merge-mr reads git_host/git_project
                # from the config itself. This block used to derive {git_owner}/{git_repo} for
                # the atomic; three callers did and one did not, so the one that did not halted
                # on lang §4.5 with an undefined variable.
                - INCLUDE: common/merge-mr
                - RUN: git worktree remove .
          FALSE:
            - OUTPUT:
                message: "Not offering the merge: the CI gate ended '{ci_status}', which is not a green verdict."
    - OUTPUT:
        message: "Story {story_key} review-finish complete."