# common/sync-issues.yaml
#
# Purpose: Syncs sprint-status.yaml entries to the issue tracker. One pass over
#           sprint-status.yaml: each entry is matched to its issue through
#           common/find-issue (by the **Sprint Key** marker the module writes into
#           every issue it creates), then created or moved to the mapped status.
#           Tracks created/updated/skipped counts.
# Input variables: (none — uses platform, host, project, sep, prd_key, branch_patterns from scope)
# Output variables:
#   - sync_created: number of issues created
#   - sync_updated: number of issues updated
#   - sync_skipped: number of issues already in sync
# Side effects: creates/updates/closes issues on the issue tracker; creates
#               and removes /tmp/issue-desc-*.md files

# Initialize counters
- SET: { variable: sync_created, value: "0" }
- SET: { variable: sync_updated, value: "0" }
- SET: { variable: sync_skipped, value: "0" }
# Read sprint-status entries
- READ: {implementation_artifacts}/sprint-status.yaml
  EXTRACT:
    entries: development_status
- LOOP:
    items: entries
    as: entry
    do:
      # --- Derive the key from the loop item, the status from the FILE ---
      # `entries` is a YAML MAP. lang §4.1 says a map item is {key, value}, but the
      # interpreter renders {entry} as the single string "key: status" — so every step
      # that used {entry} as a key put "1-1-login-form: backlog" into issue titles and
      # into /tmp/issue-desc-*.md names. Both renderings are accepted here, once, and the
      # rest of the loop body uses {entry_key} / {entry_status} only.
      - RUN: uv run --no-project python -c "
import sys
print(sys.argv[1].strip().split(':', 1)[0].strip())
" "{entry}"
        STORE: entry_key
      # The STATUS cannot come from the same split: under the OTHER rendering — the bare
      # key, which is what lang §4.1 actually specifies — there is nothing after the
      # colon, so entry_status was '', mapped_status was '' and every issue got the label
      # `status{sep}` with nothing behind it, plus a status update to that empty value.
      # The key is all the loop item has to supply; the status is read back from
      # sprint-status.yaml by that key, so both renderings produce the same answer.
      # Parsed with re rather than yaml: `uv run --no-project python` has the standard
      # library only, and development_status is a flat one-level map of scalars.
      - RUN: uv run --no-project python -c "
import re, sys
key = sys.argv[2].strip()
status = ''
inside = False
with open(sys.argv[1], 'r', encoding='utf-8') as f:
    for line in f:
        if re.match(r'^development_status\s*:', line):
            inside = True
            continue
        if not inside:
            continue
        if line.strip() and not line[:1].isspace():
            break
        m = re.match(r'\s+([^:]+?)\s*:\s*(.*?)\s*\Z', line.rstrip(chr(10)))
        if m and m.group(1).strip().strip(chr(39) + chr(34)) == key:
            status = m.group(2).strip().strip(chr(39) + chr(34))
            break
print(status)
" {implementation_artifacts}/sprint-status.yaml "{entry_key}"
        STORE: entry_status
      # --- Classify entry ---
      - RUN: uv run --no-project python -c "
import sys
key = sys.argv[1].strip()
if key.startswith('epic-') and '-retrospective' not in key:
    print('epic')
elif key.endswith('-retrospective'):
    print('retrospective')
else:
    print('story')
" "{entry_key}"
        STORE: entry_type
      # --- Extract epic number ---
      - RUN: uv run --no-project python -c "
import sys, re
key = sys.argv[1].strip()
m = re.match(r'epic-(\d+)', key)
if m:
    print(m.group(1))
else:
    parts = key.split('-')
    if len(parts) >= 2:
        print(parts[0])
    else:
        print('')
" "{entry_key}"
        STORE: epic_num
      # --- Extract title ---
      - CHECK: entry_type eq "epic"
        TRUE:
          - RUN: uv run --no-project python -c "
import sys, re
with open(sys.argv[1], 'r', encoding='utf-8') as f:
    content = f.read()
n = sys.argv[2]
# Match the full '## Epic N: <title>' line (regex anchored to EOL)
sections = list(re.finditer(r'^## Epic ' + n + r':.*\$', content, re.MULTILINE))
if not sections:
    print('Epic ' + n)
else:
    # Title comes from the '## Epic N: <title>' header itself
    # Fallback: first '# ' or '## ' (h1/h2) line that is NOT another '## Epic'
    header_line = sections[0].group(0)
    after_colon = header_line.split(':', 1)[1].strip() if ':' in header_line else ''
    title_line = after_colon
    if not title_line:
        start = sections[0].start()
        end = sections[1].start() if len(sections) > 1 else len(content)
        body = content[start:end].strip().split('\n')
        for line in body:
            stripped = line.lstrip()
            if stripped.startswith('# ') or stripped.startswith('## '):
                if not stripped.startswith('## Epic '):
                    title_line = stripped.lstrip('#').strip()
                    break
print('Epic ' + n + ': ' + title_line if title_line else 'Epic ' + n)
" {planning_artifacts}/epics.md {epic_num}
            STORE: entry_title
        FALSE:
          - CHECK: entry_type eq "retrospective"
            TRUE:
              - SET: { variable: entry_title, value: "Retrospective: Epic {epic_num}" }
            FALSE:
              # ONE title rule, shared with common/ensure-issue.yaml:
              # common/story-title.yaml. Both files used to carry their own copy and the
              # copies had drifted on the case that matters — a frontmatter
              # `title: 'Story 1.1: Login Form'` came out doubled on the ensure-issue path
              # and bare here, and that string is the identity create-issue.yaml dedupes
              # by. The atomic resolves the spec the same way this step used to
              # (spec-<storyId>-<slug>.md, stories/<storyId>-<slug>.md, then the legacy
              # <key>.md) and returns the BARE title; the "Story N.M:" prefix is composed
              # below, once. spec_path/spec_file are seeded empty because this flow has
              # neither and the atomic must not read one a previous INCLUDE left in scope.
              - SET: { variable: story_key, value: "{entry_key}" }
              - SET: { variable: spec_path, value: "" }
              - SET: { variable: spec_file, value: "" }
              - INCLUDE: common/story-title
              - RUN: uv run --no-project python -c "
import sys
key = sys.argv[1].strip()
title = sys.argv[2].strip()
parts = key.split('-')
if len(parts) >= 2:
    print('Story ' + parts[0] + '.' + parts[1] + ': ' + (title if title else 'Untitled'))
else:
    print(title if title else key)
" "{entry_key}" "{story_title}"
                STORE: entry_title
      # Map status names (entry_status came from the split at the top of the loop body)
      - CHECK: entry_status eq "drafted"
        TRUE:
          - SET: { variable: mapped_status, value: "ready-for-dev" }
        FALSE:
          - CHECK: entry_status eq "contexted"
            TRUE:
              - SET: { variable: mapped_status, value: "in-progress" }
            FALSE:
              - SET: { variable: mapped_status, value: "{entry_status}" }
      # --- Find existing issue ---
      # This loop never looks up what it just created — create-issue hands issue_id back
      # directly — so the read-your-writes flag a previous iteration's create raised is
      # cleared here. Left up, it would make the NEXT entry's miss (the normal answer on a
      # first sync, where nothing exists yet) pay find-issue's 9 s re-check for nothing.
      - SET: { variable: lookup_after_create, value: "false" }
      - SET: { variable: search_text, value: "{entry_key}" }
      - INCLUDE: common/find-issue
      - CHECK: empty issue_id
        FALSE:
          # Found — check status
          - CHECK: platform eq "gitlab"
            TRUE:
              - RUN: glab api "projects/{project_enc}/issues/{issue_id}" --hostname {host} | uv run --no-project python -c "
import json, sys
for l in json.load(sys.stdin)['labels']:
    if l.startswith('status'):
        print(l)
"
                  STORE: current_status_label
                  PLATFORM: gitlab
              FALSE:
                - RUN: gh api "repos/{project}/issues/{issue_id}" --hostname {host} --jq '[.labels[] | select(.name | startswith("status:")) | .name][0] // "none"'
                  STORE: current_status_label
                  PLATFORM: github
          # Body reconciliation is intentionally absent here. This flow mirrors
          # sprint-status.yaml to STATUS LABELS only — common/update-issue-description
          # is invoked by the workflow complete.yaml flows (bmad-prd, edit-prd,
          # correct-course) when an upstream artifact actually changed.
          - CHECK: current_status_label eq "status{sep}{mapped_status}"
            TRUE:
              # Already in sync
              - RUN: uv run --no-project python -c "
import sys
n = int(sys.argv[1]) + 1
print(n)
" {sync_skipped}
                STORE: sync_skipped
            FALSE:
              # Status differs — update
              - SET: { variable: new_status, value: "{mapped_status}" }
              - CHECK: mapped_status eq "done"
                TRUE:
                  - SET: { variable: close, value: "true" }
                FALSE:
                  - CHECK: mapped_status eq "closed"
                    TRUE:
                      - SET: { variable: close, value: "true" }
                    FALSE:
                      - CHECK: mapped_status eq "backlog"
                        TRUE:
                          - SET: { variable: close, value: "none" }
                        FALSE:
                          - CHECK: mapped_status eq "deferred"
                            TRUE:
                              - SET: { variable: close, value: "none" }
                            FALSE:
                              - CHECK: mapped_status eq "optional"
                                TRUE:
                                  - SET: { variable: close, value: "none" }
                                FALSE:
                                  - CHECK: mapped_status eq "awaiting-operator"
                                    TRUE:
                                      - SET: { variable: close, value: "none" }
                                    FALSE:
                                      - SET: { variable: close, value: "false" }
              - INCLUDE: common/update-issue-status
              - RUN: uv run --no-project python -c "
import sys
n = int(sys.argv[1]) + 1
print(n)
" {sync_updated}
                STORE: sync_updated
        TRUE:
          # No issue found — create
          - SET: { variable: issue_id, value: "" }
      # --- Create issue if needed ---
      - CHECK: empty issue_id
        TRUE:
          - WRITE:
              file: /tmp/issue-desc-{entry_key}.md
              content: "**Sprint Key:** `{entry_key}`\n**Epic:** {epic_num}\n**PRD:** {prd_key}\n\n---\n\n{entry_title}"
              mode: overwrite
          - CHECK: entry_type eq "epic"
            TRUE:
              - READ: {planning_artifacts}/epics.md
                STORE: epic_content
              # The section ends at the NEXT epic header, whichever epic it belongs to.
              # Matching only `^## Epic <n>:` finds one header, so the end offset fell back
              # to len(content) and epic 1's issue body carried epic 2 and every later
              # section in full. Same rule as correct-course/complete.yaml's epic loop.
              - RUN: uv run --no-project python -c "
import sys, re
content = sys.argv[1]
n = sys.argv[2]
headers = list(re.finditer(r'^## Epic (\d+):', content, re.MULTILINE))
body = ''
for i, m in enumerate(headers):
    if m.group(1) == n:
        end = headers[i + 1].start() if i + 1 < len(headers) else len(content)
        body = content[m.start():end].strip()
        break
print(body)
" {epic_content} {epic_num}
                STORE: epic_body
              - CHECK: empty epic_body
                FALSE:
                  - WRITE:
                      file: /tmp/issue-desc-{entry_key}.md
                      content: "**Sprint Key:** `{entry_key}`\n**Epic:** {epic_num}\n**PRD:** {prd_key}\n\n---\n\n{epic_body}"
                      mode: overwrite
          - SET: { variable: title, value: "{entry_title}" }
          - SET: { variable: labels, value: "type{sep}{entry_type}\nstatus{sep}{mapped_status}\nprd{sep}{prd_key}\n{prd_key}{sep}epic-{epic_num}" }
          - SET: { variable: description_file, value: "/tmp/issue-desc-{entry_key}.md" }
          - INCLUDE: common/create-issue
          - CHECK: mapped_status eq "done"
            TRUE:
              - INCLUDE: common/update-issue-status
            FALSE:
              - CHECK: mapped_status eq "closed"
                TRUE:
                  - INCLUDE: common/update-issue-status
          - RUN: rm -f /tmp/issue-desc-{entry_key}.md
          - RUN: uv run --no-project python -c "
import sys
n = int(sys.argv[1]) + 1
print(n)
" {sync_created}
            STORE: sync_created
